# The Xcode project is made from this file by XcodeGen (brew install xcodegen; xcodegen generate),
# so no project file has to be kept by hand. Three values come from the environment:
#   BUNDLE_ID     the app's identifier, as registered with Apple (for example com.yourname.swivel)
#   TEAM_ID       the ten-character team identifier of the Apple Developer account
#   BUILD_NUMBER  a number that goes up with every upload
name: Swivel
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    DEVELOPMENT_TEAM: ${TEAM_ID}
targets:
  Swivel:
    type: application
    platform: iOS
    sources:
      - path: Swivel
        excludes:
          - "Web"
          - "Web/**"
      # the game's page and its typeface, copied into the app as one folder, exactly as they are
      - path: Swivel/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: Swivel
        INFOPLIST_FILE: Swivel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Swivel/Swivel.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
schemes:
  Swivel:
    build:
      targets:
        Swivel: all
    run:
      config: Debug
    archive:
      config: Release
